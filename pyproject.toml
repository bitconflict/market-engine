[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-engine"
version = "2.1.0"
description = "Rules-based equity decision engine: regime, factor pillars, gated actions, self-scoring ledger"
requires-python = ">=3.9"
dependencies = ["yfinance>=0.2.40", "flask>=2.2"]

[tool.setuptools]
packages = ["engine"]
